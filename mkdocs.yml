        dynamic-programming/dp-rod-cutting-coin-change.md: dynamic-programming/dp-rod-cutting/index.md
        exercises/dp-rod-cutting-coin-change.md: exercises/dp-rod-cutting.md
        # 2026-10-12: the capacitated case of «DP for lot sizing» is a chapter of its own
        dynamic-programming/dp-lot-sizing/a-dp-algorithm-for-the-capacitated-case.md: dynamic-programming/dp-capacitated-lot-sizing.md
