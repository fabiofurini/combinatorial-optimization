# mkdocs.yml (English): generated by python/genera_sito.py from python/mkdocs_modello_en.yml (LINGUA=en).
# Do not edit mkdocs.yml by hand.
site_name: Combinatorial Optimization · Fabio Furini
site_url: https://fabiofurini.github.io/combinatorial-optimization/
site_description: >-
  Lecture notes on combinatorial optimization: knapsack, packing, coloring, clique, routing, scheduling and lot sizing problems, solved in every way: formulations and their properties, dynamic programming, heuristic, approximation and ad hoc algorithms, with exercises and Colab notebooks.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/combinatorial-optimization
copyright: >-
  &copy; 2026 Fabio Furini — text and figures licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/deed.en">CC BY 4.0</a>,
  code licensed under
  <a href="https://github.com/fabiofurini/combinatorial-optimization/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/dots-grid
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# le pagine delle singole app non stanno nel menu: il laboratorio è una voce sola
not_in_nav: |
  /lab/*.md
  !/lab/index.md

plugins:
  - search:
      lang: en
  # old URLs of chapters that were split or renamed (2026-10-12: P||Cmax, metric TSP and coloring in three chapters)
  - redirects:
      redirect_maps:
        approximation-algorithms/pcmax-tsp-coloring-approximation.md: approximation-algorithms/pcmax-approximation.md
        exercises/pcmax-tsp-coloring-approximation.md: exercises/pcmax-approximation.md
