        approximation-algorithms/coloring-approximation.md: approximation-algorithms/coloring-inapproximability.md
        exercises/coloring-approximation.md: exercises/coloring-inapproximability.md
        catalogue/dp-examples.md: catalogue/index.md
        # 2026-10-12: one catalogue page per problem (catalogue/<slug>/); the old group pages → the new family pages
        catalogue/central-problems.md: catalogue/index.md
        catalogue/knapsack-family.md: catalogue/knapsack-problems.md
        catalogue/packing.md: catalogue/packing-problems.md
        catalogue/graphs.md: catalogue/index.md
